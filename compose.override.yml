# Rootline wiring for the OpenTelemetry Demo.
#
# Run from the demo checkout (OpenTelemetry Demo 3.1.0), pinning the images
# to the tag (the demo's .env says DEMO_VERSION=latest):
#   export ROOTLINE_DIR=/path/to/RootLine DEMO_VERSION=3.1.0 DEMO_GIT_TAG=3.1.0
#   docker compose -f compose.yaml -f compose.full.yaml -f compose.observability.yaml \
#     -f "$ROOTLINE_DIR/compose.override.yml" up -d
#
# What it adds:
#   - one Toxiproxy per edge (checkout->payment, frontend->product-catalog),
#     each with a netem sidecar sharing its network namespace, so network
#     faults on one edge never touch the other
#   - checkout and frontend pointed at those proxies instead of the services
#   - the snapshotter, fed by an extra OTLP/HTTP exporter on the collector
#   - the load generator fixed at 20 users, started automatically
#
# Ports and address variables checked against demo 3.1.0's compose.yaml and
# .env (PAYMENT_PORT=50051, PRODUCT_CATALOG_PORT=3550).
# TODO(flotrpy): record image digests after the first pull
# (controller/deploy/record-digests.sh).

x-toxiproxy: &toxiproxy
  image: ghcr.io/shopify/toxiproxy:2.12.0
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 64M

x-netem: &netem
  image: alpine:3.22
  # iproute2 provides tc; the container only idles so rootlinectl can exec.
  command: ["sh", "-c", "apk add --no-cache iproute2 >/dev/null && exec sleep infinity"]
  cap_add: [NET_ADMIN]
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 32M

services:
  toxiproxy-payment:
    <<: *toxiproxy
    container_name: toxiproxy-payment
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ${ROOTLINE_DIR:?set ROOTLINE_DIR}/controller/deploy/toxiproxy-payment.json:/config/toxiproxy.json:ro
    ports:
      - "127.0.0.1:8474:8474"
    depends_on: [payment]

  netem-payment:
    <<: *netem
    container_name: netem-payment
    network_mode: "service:toxiproxy-payment"
    depends_on: [toxiproxy-payment]

  toxiproxy-catalog:
    <<: *toxiproxy
    container_name: toxiproxy-catalog
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ${ROOTLINE_DIR:?set ROOTLINE_DIR}/controller/deploy/toxiproxy-catalog.json:/config/toxiproxy.json:ro
    ports:
      - "127.0.0.1:8475:8474"
    depends_on: [product-catalog]

  netem-catalog:
    <<: *netem
    container_name: netem-catalog
    network_mode: "service:toxiproxy-catalog"
    depends_on: [toxiproxy-catalog]

  # The demo caps checkout and product-catalog at 20M (sized for its default
  # 10 users). At 20 users they hit the cap, the kernel keeps evicting their
  # code pages, and the host stalls on disk reads until both go unhealthy.
  checkout:
    environment:
      - PAYMENT_ADDR=toxiproxy-payment:${PAYMENT_PORT}
      - GOMEMLIMIT=52MiB
    deploy:
      resources:
        limits:
          memory: 64M
    depends_on: [toxiproxy-payment]

  product-catalog:
    environment:
      - GOMEMLIMIT=52MiB
    deploy:
      resources:
        limits:
          memory: 64M

  # Grafana also sat at its 175M cap with no dashboard open.
  grafana:
    deploy:
      resources:
        limits:
          memory: 300M

  # Postgres idles near its 80M cap. Under productCatalogLockContention the
  # queued connections pushed it over, the OOM killer hit a backend, and
  # Postgres crash-looped for over an hour, spoiling five pilot snapshots.
  astronomy-db:
    deploy:
      resources:
        limits:
          memory: 256M

  frontend:
    environment:
      - PRODUCT_CATALOG_ADDR=toxiproxy-catalog:${PRODUCT_CATALOG_PORT}
    depends_on: [toxiproxy-catalog]

  load-generator:
    environment:
      - LOCUST_USERS=20
      - LOCUST_SPAWN_RATE=2
      - LOCUST_AUTOSTART=true
      # The demo's tasks without the one that calls the absent agent service.
      - LOCUST_LOCUSTFILE=rootline_locustfile.py
    volumes:
      - ${ROOTLINE_DIR:?set ROOTLINE_DIR}/controller/deploy/rootline_locustfile.py:/usr/src/app/rootline_locustfile.py:ro

  otel-collector:
    volumes:
      - ${ROOTLINE_DIR:?set ROOTLINE_DIR}/controller/deploy/otelcol-config-extras.yml:/etc/otelcol-config-extras.yml:ro
    depends_on: [snapshotter]

  snapshotter:
    build:
      context: ${ROOTLINE_DIR:?set ROOTLINE_DIR}/snapshotter
      args:
        GIT_SHA: ${ROOTLINE_GIT_SHA:-unknown}
    container_name: snapshotter
    # Write snapshots as the owner of the bind-mounted data/ directory; the
    # image's default nonroot user (65532) gets "permission denied".
    user: "${ROOTLINE_UID:-1000}:${ROOTLINE_GID:-1000}"
    environment:
      - DEMO_GIT_TAG=${DEMO_GIT_TAG:-}
      - COLLECTOR_VERSION=${COLLECTOR_VERSION:-}
      - IMAGE_DIGESTS_FILE=/data/image-digests.json
    volumes:
      - ${ROOTLINE_DIR:?set ROOTLINE_DIR}/data:/data
    ports:
      - "127.0.0.1:8089:8089"
    deploy:
      resources:
        limits:
          memory: 1G

  # 16 GB hosts: candidates to trim if memory is tight. Disabling a service
  # that a pipeline exports to also needs a collector config change.
  # TODO(flotrpy): decide after the dry run (watch `docker stats`).
