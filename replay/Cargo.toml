[package]
name = "rootline"
version = "0.1.0"
description = "Replay Rootline incident snapshots and evidence packs"
license = "Apache-2.0"
authors = ["flotrpy"]
edition = "2021"

[dependencies]
anyhow = "1"
arrow = { version = "55", default-features = false }
clap = { version = "4", features = ["derive"] }
parquet = { version = "55", default-features = false, features = ["arrow", "zstd", "snap"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
