<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Rootline</title>
  <desc id="d">Rootline: which evidence does an AI need to find the root cause of a failure?</desc>
  <rect width="1280" height="320" fill="#000"/>
  <!-- The mark: a request line that drops to its root cause. -->
  <g transform="translate(96 112) scale(4)">
    <path d="M1 7h13v10h9" fill="none" stroke="#fff" stroke-width="2"/>
    <rect x="11" y="14" width="6" height="6" fill="#fff"/>
  </g>
  <text x="228" y="196" fill="#fff" font-family="Georgia, 'Times New Roman', serif" font-size="128" letter-spacing="-4">Rootline</text>
  <text x="232" y="250" fill="#a3a3a3" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="24" letter-spacing="1">When the app breaks, can an AI find why?</text>
  <line x1="96" y1="286" x2="1184" y2="286" stroke="#333"/>
  <text x="1184" y="70" fill="#737373" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="18" text-anchor="end" letter-spacing="2">OPEN BENCHMARK · v0.1.0</text>
</svg>
