name: joss-draft

# Builds the JOSS preview PDF of paper/joss/paper.md, as JOSS's editors will.
on:
  push:
    paths:
      - paper/joss/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/joss/paper.md
      - uses: actions/upload-artifact@v4
        with:
          name: joss-paper
          path: paper/joss/paper.pdf
