name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [controller, snapshotter]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: ${{ matrix.module }}
      - run: go test -race ./...

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check ../harness ../cascade ../baselines ../analysis
      - run: uv run ruff format --check ../harness ../cascade ../baselines ../analysis
      - run: uv run pyright
      - run: uv run pytest -q
