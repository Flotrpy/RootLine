[project]
name = "rootline-harness"
version = "0.1.0"
description = "Evidence packers, perturbations, scorers and evaluation harness for Rootline"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "flotrpy" }]
requires-python = ">=3.13"
dependencies = [
    "altair>=5.4",
    "drain3>=0.9.11",
    "inspect-ai>=0.3",
    "lightgbm>=4.5",
    "litellm>=1.50",
    "polars>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6",
    "scikit-learn>=1.5",
    "tiktoken>=0.7",
    "vl-convert-python>=1.7",
]

[dependency-groups]
dev = [
    "pyarrow>=18",
    "pyright>=1.1.380",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rootline_harness"]

[tool.pyright]
include = ["rootline_harness", "tests", "../cascade", "../baselines", "../analysis", "../hw/bridge-app/panel.py", "../hw/contention"]
extraPaths = ["..", "../hw/bridge-app", "../hw/contention"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
# cascade/, baselines/ and analysis/ live at the repository root.
pythonpath = [".", "..", "../hw/bridge-app", "../hw/contention"]
