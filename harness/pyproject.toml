[project]
name = "rootline-harness"
version = "0.1.0"
description = "Evidence packers, perturbations, scorers and evaluation harness for Rootline"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "flotrpy" }]
requires-python = ">=3.13"
dependencies = [
    "drain3>=0.9.11",
    "inspect-ai>=0.3",
    "litellm>=1.50",
    "polars>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6",
    "tiktoken>=0.7",
]

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rootline_harness"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["rootline_harness", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
